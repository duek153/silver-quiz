<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מי רוצה להיות מיליונר? - חתונת הכסף</title>
  <link rel="stylesheet" href="css/style.css?v=202611162353">
</head>
<body>
  <main id="app">

    <section id="screen-gate" class="screen active">
      <div class="gate-box">
        <div class="gate-ic">🔊</div>
        <p class="gate-tx">הדליקו את הרמקולים</p>
        <button id="btn-gate" class="big-btn">כניסה</button>
      </div>
    </section>

    <section id="screen-intro" class="screen">
      <div class="intro-spot"></div>
      <span class="star st1">✦</span><span class="star st2">✦</span><span class="star st3">✦</span>
      <span class="star st4">✦</span><span class="star st5">✦</span><span class="star st6">✦</span>
      <div class="intro-box">
        <div class="emblem"><span>25</span><small>שנה</small></div>
        <h1 id="title"></h1>
        <div class="orn"><i></i><b>✦</b><i></i></div>
        <p id="subtitle" class="subtitle"></p>
        <button id="btn-start" class="big-btn">מתחילים</button>
      </div>
    </section>

    <section id="screen-slideshow" class="screen">
      <h2>הזיכרונות שלנו</h2>
      <div id="slides" class="slides"></div>
      <button id="btn-slides-next" class="big-btn">ממשיכים למשחק</button>
    </section>

    <section id="screen-game" class="screen">
      <div class="game-layout">
        <div class="game-main">
          <div class="lifelines">
            <button id="ll-fifty" class="lifeline"><span class="ll-ic">50:50</span><span class="ll-tx">חמישים חמישים</span></button>
            <button id="ll-phone" class="lifeline"><span class="ll-ic">📞</span><span class="ll-tx">טלפון לילדים</span></button>
            <button id="ll-audience" class="lifeline"><span class="ll-ic">👥</span><span class="ll-tx">עזרת הקהל</span></button>
          </div>
          <div id="m-progress" class="m-progress"><i></i></div>
          <div class="q-top"><div id="q-meta" class="q-meta"></div><div id="q-timer" class="q-timer"></div></div>
          <div class="q-wrap"><div id="question" class="question"></div></div>
          <div id="answers" class="answers"></div>
          <div id="confirm" class="confirm hidden">
            <span>תשובה סופית?</span>
            <button id="btn-final" class="big-btn">כן, סופית!</button>
            <button id="btn-cancel" class="big-btn ghost">ביטול</button>
          </div>
        </div>
        <ol id="ladder" class="ladder"></ol>
      </div>
    </section>

    <section id="screen-prize" class="screen">
      <div id="countdown"><span>3</span><span>2</span><span>1</span></div>
      <h2 class="prize-title">מיליון שקל אין לנו... אבל יש לנו את זה:</h2>
      <div id="ticket" class="ticket">
        <div class="t-main">
          <div class="t-head"><span>✈ כרטיס טיסה</span><span>חתונת הכסף · 25 שנה</span></div>
          <div class="t-field"><small>נוסעים</small><strong id="t-passengers"></strong></div>
          <div class="t-field t-dest"><small>יעד</small><strong id="t-destination"></strong></div>
          <div class="t-field"><small>תאריכים</small><strong id="t-dates"></strong></div>
          <div class="t-field t-hotel"><small>מלון</small><strong id="t-hotel"></strong><em id="t-hotel-note"></em></div>
        </div>
        <div class="t-stub">
          <span class="t-25">25</span>
          <span>שנות אהבה</span>
          <div class="t-barcode"></div>
        </div>
      </div>
      <button id="btn-prize-next" class="big-btn late">ממשיכים לברכה</button>
    </section>

    <section id="screen-greeting" class="screen">
      <h2>ברכה מהילדים</h2>
      <p id="greeting-text" class="greeting-text"></p>
      <div id="greeting-photos" class="slides"></div>
      <button id="btn-restart" class="big-btn">משחק חדש</button>
    </section>
    <canvas id="confetti"></canvas>
    <div class="led l"></div><div class="led r"></div>

    <div class="spotlights"><i></i><i></i><i></i><i></i></div>
    <div id="flash" class="flash"></div>
    <button id="btn-mute" class="mute-btn" title="השתקה">🔊</button>
    <div id="route" class="route hidden">
      <div id="route-photo" class="route-photo"></div>
      <h2>המסלול שלכם</h2>
      <p id="route-msg" class="route-msg"></p>
      <ol id="route-ladder" class="ladder route-ladder"></ol>
    </div>
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
        <button id="modal-close" class="big-btn">חוזרים לשאלה</button>
      </div>
    </div>
    <div id="alarm-overlay"><span>טעות! מנסים שוב</span></div>
  </main>

  <script src="data/game-data.js?v=202611162353"></script>
  <script src="js/audio.js?v=202611162353"></script>
  <script src="js/screens.js?v=202611162353"></script>
  <script src="js/game.js?v=202611162353"></script>
</body>
</html>
